<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="824" viewBox="0 0 1080 824" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc"><title id="title">KAPE와 Windows 아티팩트 통합 분석 흐름</title><desc id="desc">전용 파서 출력 CSV를 Python으로 정규화하고, 원본 출처와 시각 의미를 보존하며 검토 보고서로 연결한다.</desc><g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><rect x="0" y="0" width="1080" height="824" rx="16" fill="#f3f6fa"/><rect x="0" y="0" width="1080" height="160" rx="16" fill="#10283f"/><text x="40" y="47" font-size="21" fill="#a3d2eb" font-weight="600">CHAPTER 13  /  WINDOWS ARTIFACT TRIAGE</text><text x="40" y="103" font-size="36" fill="white" font-weight="700">흩어진 아티팩트를, 추적 가능한 근거로</text><text x="40" y="142" font-size="24" fill="#cadce9" font-weight="400">자료 수집 → 파싱 → 정규화 → 통합 검토 → 보고</text><rect x="32" y="190" width="1016" height="160" rx="16" fill="white"/><rect x="48" y="210" width="245" height="116" rx="16" fill="#e8f1fb"/><text x="68" y="243" font-size="22" fill="#2463a0" font-weight="600">01</text><text x="68" y="291" font-size="28" fill="#2463a0" font-weight="700">수집·전용 파서</text><text x="322" y="250" font-size="25" fill="#10283f" font-weight="600">KAPE 자료 → EvtxECmd · PECmd · RECmd 등</text><text x="322" y="300" font-size="23" fill="#24364b" font-weight="400">실제 엔진 실행은 Windows 분석 환경의 확장 단계</text><text x="520" y="378" font-size="28" fill="#64788a" font-weight="600">↓</text><rect x="32" y="384" width="1016" height="160" rx="16" fill="white"/><rect x="48" y="404" width="245" height="116" rx="16" fill="#e5f3ee"/><text x="68" y="437" font-size="22" fill="#167166" font-weight="600">02</text><text x="68" y="485" font-size="28" fill="#167166" font-weight="700">Python 정규화</text><text x="322" y="444" font-size="25" fill="#10283f" font-weight="600">CSV + manifest → 호스트 · UTC · 출처 · 해시</text><text x="322" y="494" font-size="23" fill="#24364b" font-weight="400">원래 시각의 의미와 누락·오류를 함께 보존</text><text x="520" y="572" font-size="28" fill="#64788a" font-weight="600">↓</text><rect x="32" y="578" width="1016" height="160" rx="16" fill="white"/><rect x="48" y="598" width="245" height="116" rx="16" fill="#fff2da"/><text x="68" y="631" font-size="22" fill="#8c5c14" font-weight="600">03</text><text x="68" y="679" font-size="28" fill="#8c5c14" font-weight="700">검토·관련 근거</text><text x="322" y="638" font-size="25" fill="#10283f" font-weight="600">타임라인 · 규칙 일치 · 같은 경로의 여러 자료</text><text x="322" y="688" font-size="23" fill="#24364b" font-weight="400">HTML + JSON  /  우선순위는 침해 확률이 아님</text><text x="40" y="790" font-size="25" fill="#344b61" font-weight="600">판정마다 원본 파일·레코드 위치·해시로 돌아갈 수 있어야 합니다.</text></g></svg>