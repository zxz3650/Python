<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="784" viewBox="0 0 1080 784" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">문자열에서 검증된 데이터까지</title><desc id="desc">JSON 문자열을 Python dict로 파싱하고, status 값과 service 자료형 및 빈 값을 검사한다.</desc>
<g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="1080" height="784" rx="24" fill="#F3F6FA" stroke="none"/><text x="36" y="53" font-size="33" fill="#10283F" font-weight="700">JSON을 읽는 일과 검증하는 일은 다릅니다</text><text x="36" y="94" font-size="24" fill="#4F6478" font-weight="400">같은 응답이 표현과 사용 목적에 따라 세 단계를 거칩니다.</text><rect x="32" y="124" width="1016" height="166" rx="16" fill="#FFFFFF" stroke="#D9E2EB"/><rect x="48" y="142" width="56" height="40" rx="10" fill="#E8F1FB" stroke="none"/><text x="60" y="171" font-size="23" fill="#2463A0" font-weight="700">01</text><text x="122" y="171" font-size="29" fill="#2463A0" font-weight="700">본문 문자열 · str</text><text x="56" y="222" font-size="27" fill="#10283F" font-weight="500">{&quot;status&quot;: &quot;ok&quot;, &quot;service&quot;: &quot;lab&quot;}</text><text x="56" y="263" font-size="23" fill="#24364B" font-weight="400">response.text  /  아직은 이름과 값을 담은 글</text><text x="522" y="322" font-size="29" fill="#63788C" font-weight="600">↓</text><rect x="32" y="330" width="1016" height="166" rx="16" fill="#FFFFFF" stroke="#D9E2EB"/><rect x="48" y="348" width="56" height="40" rx="10" fill="#E5F3EE" stroke="none"/><text x="60" y="377" font-size="23" fill="#167166" font-weight="700">02</text><text x="122" y="377" font-size="29" fill="#167166" font-weight="700">파싱 결과 · dict</text><text x="56" y="428" font-size="27" fill="#10283F" font-weight="500">{&#x27;status&#x27;: &#x27;ok&#x27;, &#x27;service&#x27;: &#x27;lab&#x27;}</text><text x="56" y="469" font-size="23" fill="#24364B" font-weight="400">response.json()  /  필드 이름으로 값을 꺼낼 수 있음</text><text x="522" y="528" font-size="29" fill="#63788C" font-weight="600">↓</text><rect x="32" y="536" width="1016" height="166" rx="16" fill="#FFFFFF" stroke="#D9E2EB"/><rect x="48" y="554" width="56" height="40" rx="10" fill="#FFF2DA" stroke="none"/><text x="60" y="583" font-size="23" fill="#8C5C14" font-weight="700">03</text><text x="122" y="583" font-size="29" fill="#8C5C14" font-weight="700">계약 검증 · 조건 확인</text><text x="56" y="634" font-size="27" fill="#10283F" font-weight="500">status == &quot;ok&quot;  +  service는 비어 있지 않은 str</text><text x="56" y="675" font-size="23" fill="#24364B" font-weight="400">validate_health(data)  /  약속에 맞으면 사용</text><text x="40" y="746" font-size="27" fill="#344B61" font-weight="700">파싱 성공 ≠ HTTP 성공 ≠ 데이터 계약 충족</text></g></svg>