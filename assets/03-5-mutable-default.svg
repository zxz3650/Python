<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title2 desc2">
<title id="title2">변경 가능한 기본값은 def 시점에 딱 한 번만 만들어진다</title>
<desc id="desc2">tags=[]처럼 리스트를 기본값으로 쓰면 def를 실행할 때 리스트 객체가 한 번 생성되어 이후 모든 호출이 같은 객체를 공유해 누적되고, tags=None을 표식으로 쓰면 호출마다 새 리스트가 만들어짐을 비교하는 다이어그램</desc>
<defs>
  <filter id="shadowQ1"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
  <marker id="arrowQ1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb2cc"/>
  </marker>
</defs>
<rect width="1500" height="720" rx="32" fill="#071a2b"/>
<text x="60" y="55" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">기본값은 호출마다가 아니라 def를 실행할 때 한 번 만들어진다</text>
<text x="60" y="86" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">def add_tag_bad(tag, tags=[]): — 그 []는 딱 하나뿐인 객체다</text>

<text x="60" y="125" fill="#f87171" font-family="Arial, sans-serif" font-size="18" font-weight="700">✗ 피해야 할 형태</text>

<!-- def-time box -->
<g filter="url(#shadowQ1)">
<rect x="60" y="145" width="260" height="90" rx="12" fill="#3f1d1d" stroke="#ef4444" stroke-width="2.5"/>
</g>
<text x="80" y="175" fill="#fecaca" font-family="Arial, sans-serif" font-size="13" font-weight="700">def 실행 시점 (한 번만)</text>
<text x="80" y="200" fill="#fca5a5" font-family="monospace" font-size="15" font-weight="700">tags 기본값 = [] 생성</text>
<text x="80" y="220" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12">이 리스트 객체 하나가 함수에 고정됨</text>

<line x1="320" y1="190" x2="1420" y2="190" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
<text x="700" y="180" fill="#f87171" font-family="Arial, sans-serif" font-size="12">↓ 이후 모든 호출이 이 같은 리스트를 계속 사용·변경한다</text>

<!-- call 1 -->
<rect x="60" y="255" width="440" height="150" rx="14" fill="#0d1f30" stroke="#f59e0b" stroke-width="2.5"/>
<text x="90" y="285" fill="#fcd34d" font-family="monospace" font-size="15" font-weight="700">add_tag_bad("web")</text>
<line x1="90" y1="300" x2="90" y2="330" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowQ1)"/>
<text x="110" y="320" fill="#93c5fd" font-family="Arial, sans-serif" font-size="12">공유 리스트에 "web" 추가</text>
<rect x="90" y="335" width="200" height="46" rx="8" fill="#102338" stroke="#7fb2cc" stroke-width="2"/>
<text x="190" y="364" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="15">['web']</text>
<text x="90" y="400" fill="#7fb2cc" font-family="Arial, sans-serif" font-size="12">→ 반환: ['web']</text>

<!-- call 2 -->
<rect x="540" y="255" width="440" height="150" rx="14" fill="#0d1f30" stroke="#f59e0b" stroke-width="2.5"/>
<text x="570" y="285" fill="#fcd34d" font-family="monospace" font-size="15" font-weight="700">add_tag_bad("critical")</text>
<line x1="570" y1="300" x2="570" y2="330" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowQ1)"/>
<text x="590" y="320" fill="#93c5fd" font-family="Arial, sans-serif" font-size="12">같은 공유 리스트에 추가</text>
<rect x="570" y="335" width="330" height="46" rx="8" fill="#102338" stroke="#7fb2cc" stroke-width="2"/>
<text x="735" y="364" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="15">['web', 'critical']</text>
<text x="570" y="400" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12" font-weight="700">→ 반환: ['web', 'critical'] (예상 밖 누적)</text>

<rect x="1020" y="255" width="420" height="150" rx="14" fill="#0d1f30" stroke="#334155" stroke-width="2"/>
<text x="1050" y="288" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">두 호출이 서로 다른</text>
<text x="1050" y="310" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">태그 목록을 기대했지만</text>
<text x="1050" y="345" fill="#fca5a5" font-family="Arial, sans-serif" font-size="14" font-weight="700">실제로는 하나의 리스트를</text>
<text x="1050" y="367" fill="#fca5a5" font-family="Arial, sans-serif" font-size="14" font-weight="700">누적해서 공유한다</text>

<!-- safe version -->
<text x="60" y="450" fill="#4ade80" font-family="Arial, sans-serif" font-size="18" font-weight="700">✓ 안전한 형태: None을 표식으로 사용</text>

<rect x="60" y="470" width="660" height="60" rx="10" fill="#0d1f30" stroke="#22c55e" stroke-width="2"/>
<text x="90" y="507" fill="#e6f6ff" font-family="monospace" font-size="15">def add_tag(tag, tags=None):  if tags is None: tags = []</text>

<rect x="60" y="545" width="300" height="130" rx="14" fill="#0d1f30" stroke="#22c55e" stroke-width="2.5"/>
<text x="90" y="575" fill="#86efac" font-family="monospace" font-size="14" font-weight="700">add_tag("web")</text>
<text x="90" y="600" fill="#93c5fd" font-family="Arial, sans-serif" font-size="12">tags is None → 새 [] 생성</text>
<rect x="90" y="612" width="180" height="42" rx="8" fill="#102338" stroke="#22c55e" stroke-width="2"/>
<text x="180" y="638" text-anchor="middle" fill="#dcfce7" font-family="monospace" font-size="14">['web']</text>

<rect x="400" y="545" width="300" height="130" rx="14" fill="#0d1f30" stroke="#22c55e" stroke-width="2.5"/>
<text x="430" y="575" fill="#86efac" font-family="monospace" font-size="14" font-weight="700">add_tag("critical")</text>
<text x="430" y="600" fill="#93c5fd" font-family="Arial, sans-serif" font-size="12">tags is None → 또 새 [] 생성</text>
<rect x="430" y="612" width="220" height="42" rx="8" fill="#102338" stroke="#22c55e" stroke-width="2"/>
<text x="540" y="638" text-anchor="middle" fill="#dcfce7" font-family="monospace" font-size="14">['critical']</text>

<rect x="740" y="545" width="700" height="130" rx="14" fill="#0d1f30" stroke="#334155" stroke-width="2"/>
<text x="770" y="580" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">assert first is not second</text>
<text x="770" y="610" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="13">호출마다 독립된 리스트 객체가 만들어지므로</text>
<text x="770" y="632" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="13">서로 다른 호출의 결과가 섞이지 않는다</text>
<text x="770" y="660" fill="#7fb2cc" font-family="Arial, sans-serif" font-size="12">문자열·숫자·튜플처럼 변경 불가능한 값은 기본값으로 안전하다</text>
</svg>
