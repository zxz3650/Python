<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title7 desc7">
<title id="title7">list_all()이 리스트가 아니라 튜플을 반환하는 이유</title>
<desc id="desc7">EventStore.list_all()이 내부 리스트 self._events를 그대로 반환했다면 호출자가 반환값에 append를 호출해 검증 없이 저장소 내부 상태를 오염시킬 수 있지만, 실제 구현처럼 tuple(self._events)로 복사해 반환하면 튜플에는 append가 없어서 그런 우회 변경이 원천적으로 막힘을 비교하는 다이어그램</desc>
<defs>
  <filter id="shadowHH1"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
</defs>
<rect width="1500" height="560" rx="32" fill="#071a2b"/>
<text x="60" y="55" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">내부 리스트를 그대로 내주면 검증을 우회해 상태를 바꿀 수 있다</text>
<text x="60" y="86" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">class EventStore: def list_all(self): return tuple(self._events)</text>

<!-- LEFT: hypothetical - return list directly -->
<rect x="60" y="120" width="670" height="400" rx="20" fill="#0d1f30" stroke="#ef4444" stroke-width="3"/>
<text x="90" y="155" fill="#fca5a5" font-family="Arial, sans-serif" font-size="18" font-weight="700">✗ 만약 리스트를 그대로 반환했다면</text>
<text x="90" y="178" fill="#7fb2cc" font-family="monospace" font-size="13">def list_all(self): return self._events</text>

<rect x="90" y="195" width="600" height="55" rx="10" fill="#102338" stroke="#334155" stroke-width="2"/>
<text x="110" y="228" fill="#e6f6ff" font-family="monospace" font-size="14">leaked = store.list_all()  # self._events와 같은 객체</text>

<g filter="url(#shadowHH1)">
<rect x="90" y="270" width="600" height="100" rx="12" fill="#3f1d1d" stroke="#ef4444" stroke-width="3"/>
</g>
<text x="110" y="302" fill="#fecaca" font-family="monospace" font-size="15" font-weight="700">leaked.append(fake_event)</text>
<text x="110" y="328" fill="#fca5a5" font-family="Arial, sans-serif" font-size="13" font-weight="700">add()의 중복·검증 로직을 전혀 거치지 않음</text>
<text x="110" y="350" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12">store._events에도 fake_event가 그대로 들어감</text>

<rect x="90" y="390" width="600" height="100" rx="10" fill="#102338" stroke="#334155" stroke-width="2"/>
<text x="110" y="420" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">문제의 핵심</text>
<text x="110" y="446" fill="#93c5fd" font-family="Arial, sans-serif" font-size="13">"조회용으로 꺼내준 값"과 "내부 상태"가 같은 객체다</text>
<text x="110" y="468" fill="#93c5fd" font-family="Arial, sans-serif" font-size="13">SecurityEvent</text>

<!-- RIGHT: actual - return tuple copy -->
<rect x="770" y="120" width="670" height="400" rx="20" fill="#0d1f30" stroke="#22c55e" stroke-width="3"/>
<text x="800" y="155" fill="#86efac" font-family="Arial, sans-serif" font-size="18" font-weight="700">✓ 실제 구현: 새 튜플로 복사해 반환</text>
<text x="800" y="178" fill="#7fb2cc" font-family="monospace" font-size="13">def list_all(self): return tuple(self._events)</text>

<rect x="800" y="195" width="600" height="55" rx="10" fill="#102338" stroke="#334155" stroke-width="2"/>
<text x="820" y="228" fill="#e6f6ff" font-family="monospace" font-size="14">safe = store.list_all()  # 매번 새로 만든 튜플</text>

<g filter="url(#shadowHH1)">
<rect x="800" y="270" width="600" height="100" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="3"/>
</g>
<text x="820" y="302" fill="#dcfce7" font-family="monospace" font-size="15" font-weight="700">safe.append(fake_event)</text>
<text x="820" y="328" fill="#86efac" font-family="Arial, sans-serif" font-size="13" font-weight="700">AttributeError: 'tuple' object has no</text>
<text x="820" y="350" fill="#86efac" font-family="Arial, sans-serif" font-size="13" font-weight="700">attribute 'append'</text>

<rect x="800" y="390" width="600" height="100" rx="10" fill="#102338" stroke="#334155" stroke-width="2"/>
<text x="820" y="420" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">왜 안전한가</text>
<text x="820" y="446" fill="#86efac" font-family="Arial, sans-serif" font-size="13">호출자는 원본과 다른 새 튜플을 받는다</text>
<text x="820" y="468" fill="#86efac" font-family="Arial, sans-serif" font-size="13">튜플 자체가 변경 불가능해 우회 추가 방법이 없다</text>

<rect x="60" y="535" width="1380" height="1" fill="none"/>
</svg>
