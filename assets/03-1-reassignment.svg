<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title3 desc3">
<title id="title3">재대입과 불변 객체: a와 b는 어떻게 되는가</title>
<desc id="desc3">a = 443, b = a, a = 8443 세 단계를 거치며 이름표와 객체가 어떻게 바뀌는지 보여주는 다이어그램</desc>
<defs>
  <linearGradient id="objBlue3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <filter id="shadow3"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
</defs>
<rect width="1600" height="560" rx="32" fill="#071a2b"/>
<text x="60" y="60" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">재대입해도 기존 객체는 바뀌지 않는다</text>

<!-- divider lines between panels -->
<line x1="533" y1="90" x2="533" y2="540" stroke="#1e3a52" stroke-width="2" stroke-dasharray="6 8"/>
<line x1="1066" y1="90" x2="1066" y2="540" stroke="#1e3a52" stroke-width="2" stroke-dasharray="6 8"/>

<!-- Panel 1 -->
<rect x="40" y="100" width="200" height="46" rx="10" fill="#0f2437" stroke="#334155"/>
<text x="140" y="130" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="20">a = 443</text>

<path d="M110 300 h110 l26 30 l-26 30 h-110 z" fill="#f59e0b"/>
<text x="165" y="336" text-anchor="middle" fill="#241018" font-family="monospace" font-size="20" font-weight="700">a</text>
<path d="M256 330 H320" stroke="url(#objBlue3)" stroke-width="7" stroke-linecap="round"/>
<path d="M302 312 L328 330 L302 348" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="400" cy="330" r="64" fill="url(#objBlue3)" stroke="#e6f6ff" stroke-width="3"/>
<text x="400" y="340" text-anchor="middle" fill="white" font-family="monospace" font-size="26" font-weight="700">443</text>

<text x="90" y="470" fill="#bfe6f7" font-family="Arial, sans-serif" font-size="17">a라는 이름표가</text>
<text x="90" y="495" fill="#bfe6f7" font-family="Arial, sans-serif" font-size="17">객체 443을 가리킨다.</text>

<!-- arrow between panel 1 and 2 -->
<path d="M480 330 H560" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
<path d="M540 312 L568 330 L540 348" fill="none" stroke="#38bdf8" stroke-width="6"/>

<!-- Panel 2 -->
<rect x="573" y="100" width="200" height="46" rx="10" fill="#0f2437" stroke="#334155"/>
<text x="673" y="130" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="20">b = a</text>

<path d="M600 250 h110 l26 30 l-26 30 h-110 z" fill="#f59e0b"/>
<text x="655" y="286" text-anchor="middle" fill="#241018" font-family="monospace" font-size="20" font-weight="700">a</text>
<path d="M600 380 h110 l26 30 l-26 30 h-110 z" fill="#fbbf24"/>
<text x="655" y="416" text-anchor="middle" fill="#241018" font-family="monospace" font-size="20" font-weight="700">b</text>

<path d="M746 280 L890 330" stroke="url(#objBlue3)" stroke-width="6" stroke-linecap="round"/>
<path d="M746 410 L890 335" stroke="url(#objBlue3)" stroke-width="6" stroke-linecap="round"/>
<circle cx="930" cy="330" r="64" fill="url(#objBlue3)" stroke="#e6f6ff" stroke-width="3"/>
<text x="930" y="340" text-anchor="middle" fill="white" font-family="monospace" font-size="26" font-weight="700">443</text>

<text x="620" y="470" fill="#bfe6f7" font-family="Arial, sans-serif" font-size="17">b는 새 객체가 아니라</text>
<text x="620" y="495" fill="#bfe6f7" font-family="Arial, sans-serif" font-size="17">같은 443 객체를 가리킨다.</text>

<!-- arrow between panel 2 and 3 -->
<path d="M1013 330 H1093" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
<path d="M1073 312 L1101 330 L1073 348" fill="none" stroke="#38bdf8" stroke-width="6"/>

<!-- Panel 3 -->
<rect x="1106" y="100" width="220" height="46" rx="10" fill="#0f2437" stroke="#334155"/>
<text x="1216" y="130" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="20">a = 8443</text>

<path d="M1130 220 h110 l26 30 l-26 30 h-110 z" fill="#f59e0b"/>
<text x="1185" y="256" text-anchor="middle" fill="#241018" font-family="monospace" font-size="20" font-weight="700">a</text>
<path d="M1276 250 H1340" stroke="url(#objBlue3)" stroke-width="7" stroke-linecap="round"/>
<path d="M1322 232 L1348 250 L1322 268" fill="none" stroke="#06b6d4" stroke-width="7"/>
<circle cx="1440" cy="250" r="62" fill="url(#objBlue3)" stroke="#e6f6ff" stroke-width="3"/>
<text x="1440" y="260" text-anchor="middle" fill="white" font-family="monospace" font-size="24" font-weight="700">8443</text>
<text x="1440" y="188" text-anchor="middle" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="15" font-weight="700">새 객체</text>

<path d="M1130 420 h110 l26 30 l-26 30 h-110 z" fill="#fbbf24" opacity="0.9"/>
<text x="1185" y="456" text-anchor="middle" fill="#241018" font-family="monospace" font-size="20" font-weight="700">b</text>
<path d="M1276 450 H1340" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
<path d="M1322 432 L1348 450 L1322 468" fill="none" stroke="#64748b" stroke-width="7"/>
<circle cx="1440" cy="450" r="62" fill="#1e3a52" stroke="#64748b" stroke-width="3"/>
<text x="1440" y="460" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="24" font-weight="700">443</text>
<text x="1440" y="530" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">기존 객체는 그대로</text>
</svg>
