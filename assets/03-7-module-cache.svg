<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title3 desc3">
<title id="title3">모듈은 sys.modules에 캐시되어 두 번째 import부터 재사용된다</title>
<desc id="desc3">처음 import settings를 실행하면 최상위 코드가 실행되고 결과 모듈 객체가 sys.modules에 저장되지만, 이후 같은 인터프리터에서 다시 import settings를 실행하면 캐시된 객체를 그대로 반환할 뿐 최상위 코드를 다시 실행하지 않음을 보여주는 다이어그램</desc>
<defs>
  <filter id="shadowZ1"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
  <marker id="arrowZ1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb2cc"/>
  </marker>
</defs>
<rect width="1500" height="560" rx="32" fill="#071a2b"/>
<text x="60" y="55" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">같은 모듈을 두 번 import해도 최상위 코드는 한 번만 실행된다</text>
<text x="60" y="86" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">import settings — 두 번째부터는 sys.modules의 캐시된 객체를 그대로 돌려준다</text>

<!-- FIRST import -->
<text x="60" y="130" fill="#38bdf8" font-family="Arial, sans-serif" font-size="18" font-weight="700">처음 import settings</text>

<rect x="60" y="150" width="280" height="70" rx="10" fill="#102338" stroke="#38bdf8" stroke-width="2.5"/>
<text x="80" y="180" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">1. sys.modules 확인</text>
<text x="80" y="203" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12">"settings" 없음</text>

<line x1="340" y1="185" x2="390" y2="185" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowZ1)"/>

<g filter="url(#shadowZ1)">
<rect x="400" y="150" width="420" height="70" rx="10" fill="#3f1d1d" stroke="#f59e0b" stroke-width="2.5"/>
</g>
<text x="420" y="178" fill="#fed7aa" font-family="Arial, sans-serif" font-size="13" font-weight="700">2. 최상위 코드 실행</text>
<text x="420" y="200" fill="#fecaca" font-family="monospace" font-size="12">print("settings 모듈 초기화") 등</text>

<line x1="820" y1="185" x2="870" y2="185" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowZ1)"/>

<rect x="880" y="150" width="300" height="70" rx="10" fill="#102338" stroke="#a855f7" stroke-width="2.5"/>
<text x="900" y="178" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">3. 모듈 객체 생성</text>
<text x="900" y="200" fill="#d8b4fe" font-family="Arial, sans-serif" font-size="12">DEFAULT_PORT, get_default_port 포함</text>

<line x1="1030" y1="220" x2="1030" y2="255" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowZ1)"/>

<g filter="url(#shadowZ1)">
<rect x="820" y="260" width="420" height="70" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
</g>
<text x="840" y="290" fill="#dcfce7" font-family="monospace" font-size="14" font-weight="700">sys.modules["settings"] = &lt;module&gt;</text>
<text x="840" y="312" fill="#86efac" font-family="Arial, sans-serif" font-size="12">캐시에 저장됨 (객체 #1)</text>

<!-- divider -->
<line x1="60" y1="360" x2="1440" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>

<!-- SECOND import -->
<text x="60" y="400" fill="#4ade80" font-family="Arial, sans-serif" font-size="18" font-weight="700">이후 다시 import settings (같은 실행 중)</text>

<rect x="60" y="420" width="280" height="70" rx="10" fill="#102338" stroke="#38bdf8" stroke-width="2.5"/>
<text x="80" y="450" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">1. sys.modules 확인</text>
<text x="80" y="473" fill="#86efac" font-family="Arial, sans-serif" font-size="12">"settings" 있음 (캐시 적중)</text>

<line x1="340" y1="455" x2="390" y2="455" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowZ1)"/>

<rect x="400" y="420" width="420" height="70" rx="10" fill="#0d1826" stroke="#475569" stroke-width="2" stroke-dasharray="5,4" opacity="0.7"/>
<text x="420" y="448" fill="#64748b" font-family="Arial, sans-serif" font-size="13" font-weight="700" opacity="0.9">2. 최상위 코드 — 실행 건너뜀</text>
<text x="420" y="470" fill="#64748b" font-family="Arial, sans-serif" font-size="12" opacity="0.9">초기화 print가 다시 출력되지 않음</text>

<line x1="820" y1="455" x2="870" y2="455" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowZ1)"/>

<g filter="url(#shadowZ1)">
<rect x="880" y="420" width="420" height="70" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
</g>
<text x="900" y="448" fill="#dcfce7" font-family="Arial, sans-serif" font-size="13" font-weight="700">3. 캐시된 객체 #1을 그대로 반환</text>
<text x="900" y="470" fill="#86efac" font-family="Arial, sans-serif" font-size="12">assert first is second → True</text>

<rect x="60" y="510" width="1380" height="40" rx="10" fill="#0d1f30" stroke="#334155" stroke-width="2"/>
<text x="90" y="536" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="13">소스 파일을 수정해도 이미 로드된 모듈은 그대로다 — REPL·Jupyter라면 재시작이 가장 확실하다</text>
</svg>
