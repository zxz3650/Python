<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title2 desc2">
<title id="title2">sys.path는 순서대로 검색되며 앞선 항목이 뒤 항목을 가릴 수 있다</title>
<desc id="desc2">import json을 실행하면 sys.path에 나열된 디렉터리를 순서대로 검색하는데 프로젝트 디렉터리에 같은 이름의 json.py가 있으면 표준 라이브러리보다 먼저 발견되어 이름을 가리는 위험을 정상 검색과 비교하는 다이어그램</desc>
<defs>
  <filter id="shadowY1"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
  <marker id="arrowY1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb2cc"/>
  </marker>
</defs>
<rect width="1500" height="620" rx="32" fill="#071a2b"/>
<text x="60" y="55" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">import json은 sys.path를 순서대로 검색해 처음 찾은 것을 사용한다</text>
<text x="60" y="86" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">프로젝트 폴더에 같은 이름의 파일이 있으면 표준 라이브러리보다 먼저 발견된다</text>

<!-- LEFT: normal -->
<text x="60" y="130" fill="#4ade80" font-family="Arial, sans-serif" font-size="18" font-weight="700">✓ project/json.py가 없을 때</text>

<rect x="60" y="150" width="640" height="60" rx="10" fill="#102338" stroke="#7fb2cc" stroke-width="2"/>
<text x="80" y="185" fill="#e6f6ff" font-family="monospace" font-size="14">0: 스크립트 디렉터리 (project/)</text>
<text x="560" y="185" fill="#64748b" font-family="Arial, sans-serif" font-size="13">json.py 없음</text>

<line x1="380" y1="210" x2="380" y2="240" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowY1)"/>

<rect x="60" y="245" width="640" height="60" rx="10" fill="#102338" stroke="#7fb2cc" stroke-width="2"/>
<text x="80" y="280" fill="#e6f6ff" font-family="monospace" font-size="14">1: 가상환경 site-packages</text>
<text x="560" y="280" fill="#64748b" font-family="Arial, sans-serif" font-size="13">여기도 없음</text>

<line x1="380" y1="305" x2="380" y2="335" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowY1)"/>

<g filter="url(#shadowY1)">
<rect x="60" y="340" width="640" height="70" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="3"/>
</g>
<text x="80" y="372" fill="#dcfce7" font-family="monospace" font-size="14" font-weight="700">2: 표준 라이브러리 경로 — 진짜 json 모듈 ✓</text>
<text x="80" y="395" fill="#86efac" font-family="Arial, sans-serif" font-size="12">여기서 발견 → 기대한 표준 json이 로드됨</text>

<!-- RIGHT: shadowed -->
<text x="800" y="130" fill="#f87171" font-family="Arial, sans-serif" font-size="18" font-weight="700">✗ project/json.py가 있을 때</text>

<g filter="url(#shadowY1)">
<rect x="800" y="150" width="640" height="70" rx="10" fill="#3f1d1d" stroke="#ef4444" stroke-width="3"/>
</g>
<text x="820" y="182" fill="#fecaca" font-family="monospace" font-size="14" font-weight="700">0: 스크립트 디렉터리 (project/)</text>
<text x="820" y="205" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12">project/json.py 발견 → 검색 즉시 종료</text>

<line x1="1120" y1="220" x2="1120" y2="250" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
<text x="1140" y="240" fill="#64748b" font-family="Arial, sans-serif" font-size="12">더 내려가지 않음</text>

<rect x="800" y="255" width="640" height="55" rx="10" fill="#0d1826" stroke="#475569" stroke-width="2" stroke-dasharray="5,4" opacity="0.6"/>
<text x="820" y="288" fill="#64748b" font-family="monospace" font-size="13" opacity="0.85">1: 가상환경 site-packages — 확인 안 함</text>

<rect x="800" y="320" width="640" height="55" rx="10" fill="#0d1826" stroke="#475569" stroke-width="2" stroke-dasharray="5,4" opacity="0.6"/>
<text x="820" y="353" fill="#64748b" font-family="monospace" font-size="13" opacity="0.85">2: 표준 라이브러리의 진짜 json — 도달 못 함</text>

<rect x="800" y="390" width="640" height="70" rx="10" fill="#3f1d1d" stroke="#ef4444" stroke-width="2"/>
<text x="820" y="422" fill="#fecaca" font-family="Arial, sans-serif" font-size="13" font-weight="700">json.loads(...) 같은 표준 기능이 없거나</text>
<text x="820" y="444" fill="#fca5a5" font-family="Arial, sans-serif" font-size="13" font-weight="700">의도하지 않은 코드가 대신 실행될 수 있음</text>

<!-- footer -->
<rect x="60" y="470" width="1380" height="110" rx="14" fill="#0d1f30" stroke="#334155" stroke-width="2"/>
<text x="90" y="503" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">확인 방법과 예방</text>
<text x="90" y="530" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="13">print(json.__file__)로 실제 로드된 파일 경로를 확인한다 — 프로젝트 안의 경로가 나오면 이름 충돌을 의심한다</text>
<text x="90" y="555" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="13">json, logging, socket, email처럼 자주 쓰는 표준 모듈 이름을 프로젝트 파일명으로 사용하지 않는다</text>
</svg>
