<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title8 desc8">
<title id="title8">오류가 난 명령은 건너뛰고 quit에서 정상 종료하는 세션 루프</title>
<desc id="desc8">run_session이 명령 목록을 순서대로 처리하면서 성공한 명령은 결과를 쌓고, TypeError·ValueError·IndexError가 발생한 명령은 오류 메시지를 남기고 continue로 다음 명령을 계속 처리하며, quit 명령만 예외가 아니라 keep_running=False 신호로 루프를 break하고, quit 이후의 명령은 아예 실행되지 않음을 순서대로 보여주는 다이어그램</desc>
<defs>
  <marker id="arrowII1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb2cc"/>
  </marker>
</defs>
<rect width="1500" height="680" rx="32" fill="#071a2b"/>
<text x="60" y="55" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">for text in commands: 오류 하나가 세션 전체를 멈추지 않는다</text>
<text x="60" y="86" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">except (TypeError, ValueError, IndexError): 오류 기록 후 continue · quit만 keep_running=False로 break</text>

<line x1="100" y1="159" x2="100" y2="559" stroke="#334155" stroke-width="3"/>

<!-- Row 1: list -> success -->
<circle cx="100" cy="159" r="9" fill="#22c55e"/>
<rect x="140" y="125" width="1300" height="68" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
<text x="170" y="153" fill="#e6f6ff" font-family="monospace" font-size="15" font-weight="700">"list"</text>
<text x="800" y="153" fill="#dcfce7" font-family="Arial, sans-serif" font-size="14" font-weight="700">성공 · "목록이 비어 있습니다" 출력</text>
<text x="800" y="177" fill="#86efac" font-family="Arial, sans-serif" font-size="12">try 블록이 예외 없이 끝남 → 결과를 outputs에 추가</text>

<!-- Row 2: add allow -> success -->
<circle cx="100" cy="239" r="9" fill="#22c55e"/>
<rect x="140" y="205" width="1300" height="68" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
<text x="170" y="233" fill="#e6f6ff" font-family="monospace" font-size="15" font-weight="700">"add allow 192.0.2.10 443"</text>
<text x="800" y="233" fill="#dcfce7" font-family="Arial, sans-serif" font-size="14" font-weight="700">성공 · 이벤트 추가</text>
<text x="800" y="257" fill="#86efac" font-family="Arial, sans-serif" font-size="12">정규화 후 store.add() 성공 → "추가: ALLOW ..." 출력</text>

<!-- Row 3: duplicate add -> caught error -->
<circle cx="100" cy="319" r="9" fill="#f59e0b"/>
<rect x="140" y="285" width="1300" height="68" rx="12" fill="#1f1a12" stroke="#f59e0b" stroke-width="2.5"/>
<text x="170" y="313" fill="#fef3c7" font-family="monospace" font-size="15" font-weight="700">"add ALLOW 192.0.2.10 443"  (중복)</text>
<text x="800" y="313" fill="#fef3c7" font-family="Arial, sans-serif" font-size="14" font-weight="700">ValueError · 동일 이벤트 이미 존재</text>
<text x="800" y="337" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12">except에서 잡혀 "오류: ..." 기록 → continue로 다음 명령 진행</text>

<!-- Row 4: invalid action -> caught error -->
<circle cx="100" cy="399" r="9" fill="#f59e0b"/>
<rect x="140" y="365" width="1300" height="68" rx="12" fill="#1f1a12" stroke="#f59e0b" stroke-width="2.5"/>
<text x="170" y="393" fill="#fef3c7" font-family="monospace" font-size="15" font-weight="700">"add BLOCK 203.0.113.8 80"</text>
<text x="800" y="393" fill="#fef3c7" font-family="Arial, sans-serif" font-size="14" font-weight="700">ValueError · action은 ALLOW/DENY만 허용</text>
<text x="800" y="417" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12">SecurityEvent.__post_init__에서 발생 → 잡혀서 continue</text>

<!-- Row 5: quit -> break, not exception -->
<circle cx="100" cy="479" r="9" fill="#38bdf8"/>
<rect x="140" y="445" width="1300" height="68" rx="12" fill="#0d1f30" stroke="#38bdf8" stroke-width="3"/>
<text x="170" y="473" fill="#e6f6ff" font-family="monospace" font-size="15" font-weight="700">"quit"</text>
<text x="800" y="473" fill="#93c5fd" font-family="Arial, sans-serif" font-size="14" font-weight="700">정상 종료 신호 · 예외가 아니다</text>
<text x="800" y="497" fill="#7fb2cc" font-family="Arial, sans-serif" font-size="12">execute_command가 (False, [...])를 반환 → if not keep_running: break</text>

<!-- Row 6: after quit -> unreached -->
<circle cx="100" cy="559" r="9" fill="#64748b"/>
<rect x="140" y="525" width="1300" height="68" rx="12" fill="#0d1f30" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<text x="170" y="553" fill="#94a3b8" font-family="monospace" font-size="15" font-weight="700">"add DENY 203.0.113.9 53"  (quit 뒤)</text>
<text x="800" y="553" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" font-weight="700">실행되지 않음</text>
<text x="800" y="577" fill="#64748b" font-family="Arial, sans-serif" font-size="12">루프가 이미 break로 끝났으므로 for가 이 항목까지 가지 않음</text>

<rect x="60" y="615" width="1380" height="45" rx="10" fill="#102338" stroke="#334155" stroke-width="2"/>
<text x="90" y="643" fill="#93c5fd" font-family="Arial, sans-serif" font-size="13">결과: 4건의 add/find류 오류는 "오류: ..."로 남고 세션은 계속됐지만, quit은 오류 없이 정상적으로 세션을 끝냈다</text>
</svg>
