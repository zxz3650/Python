<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title4 desc4">
<title id="title4">enumerate는 위치를 붙이고, zip은 두 목록을 나란히 묶는다</title>
<desc id="desc4">enumerate(lines, start=1)가 각 값에 사람이 세는 행 번호를 붙이는 방식과, zip이 두 리스트를 같은 위치끼리 짝짓다가 더 짧은 쪽이 끝나면 조용히 멈추는 동작 및 strict=True로 길이 불일치를 잡아내는 방법을 보여주는 다이어그램</desc>
<defs>
  <filter id="shadowH1"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
  <marker id="arrowH1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb2cc"/>
  </marker>
</defs>
<rect width="1500" height="700" rx="32" fill="#071a2b"/>
<text x="60" y="55" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">enumerate는 번호를 붙이고, zip은 나란히 묶는다</text>
<text x="60" y="86" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">두 도구 모두 여러 값을 한 번에 다루지만 만드는 짝의 의미가 다르다</text>

<!-- ROW 1: enumerate -->
<text x="60" y="130" fill="#38bdf8" font-family="monospace" font-size="17" font-weight="700">enumerate(lines, start=1)</text>

<rect x="60" y="145" width="300" height="56" rx="10" fill="#102338" stroke="#7fb2cc" stroke-width="2"/>
<text x="210" y="179" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="14">"ALLOW 10.0.0.5"</text>

<rect x="390" y="145" width="300" height="56" rx="10" fill="#0d1826" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
<text x="540" y="179" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="14">"" (빈 줄)</text>

<rect x="720" y="145" width="330" height="56" rx="10" fill="#102338" stroke="#7fb2cc" stroke-width="2"/>
<text x="885" y="179" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="14">"DENY 198.51.100.9"</text>

<line x1="210" y1="201" x2="210" y2="235" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowH1)"/>
<line x1="540" y1="201" x2="540" y2="235" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowH1)"/>
<line x1="885" y1="201" x2="885" y2="235" stroke="#7fb2cc" stroke-width="2" marker-end="url(#arrowH1)"/>

<g filter="url(#shadowH1)">
<rect x="90" y="240" width="240" height="60" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
</g>
<text x="210" y="277" text-anchor="middle" fill="#dcfce7" font-family="monospace" font-size="16" font-weight="700">(1, "ALLOW ...")</text>

<rect x="420" y="240" width="240" height="60" rx="10" fill="#0d1826" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
<text x="540" y="270" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="15">(2, "")</text>
<text x="540" y="290" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">→ continue로 건너뜀</text>

<g filter="url(#shadowH1)">
<rect x="750" y="240" width="270" height="60" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
</g>
<text x="885" y="277" text-anchor="middle" fill="#dcfce7" font-family="monospace" font-size="16" font-weight="700">(3, "DENY ...")</text>

<rect x="1080" y="145" width="360" height="155" rx="12" fill="#0d1f30" stroke="#334155" stroke-width="2"/>
<text x="1105" y="178" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">start=1의 의미</text>
<text x="1105" y="205" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="13">사람이 세는 로그의 실제 행 번호</text>
<text x="1105" y="228" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="13">(1행, 2행, 3행...)와 맞춘다</text>
<text x="1105" y="258" fill="#7fb2cc" font-family="Arial, sans-serif" font-size="13">원본 리스트 인덱스가 필요하면</text>
<text x="1105" y="280" fill="#7fb2cc" font-family="Arial, sans-serif" font-size="13">기본값 0을 유지한다</text>

<!-- ROW 2: zip -->
<text x="60" y="370" fill="#a855f7" font-family="monospace" font-size="17" font-weight="700">zip(ips, actions)</text>

<rect x="60" y="390" width="220" height="52" rx="10" fill="#102338" stroke="#a855f7" stroke-width="2"/>
<text x="170" y="422" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="14">"10.0.0.5"</text>
<rect x="300" y="390" width="220" height="52" rx="10" fill="#102338" stroke="#a855f7" stroke-width="2"/>
<text x="410" y="422" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="14">"198.51.100.9"</text>
<rect x="540" y="390" width="220" height="52" rx="10" fill="#0d1826" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
<text x="650" y="422" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="14">"172.16.0.9"</text>
<text x="800" y="422" fill="#64748b" font-family="Arial, sans-serif" font-size="13">← ips가 하나 더 많음</text>

<rect x="60" y="470" width="220" height="52" rx="10" fill="#102338" stroke="#f59e0b" stroke-width="2"/>
<text x="170" y="502" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="14">"ALLOW"</text>
<rect x="300" y="470" width="220" height="52" rx="10" fill="#102338" stroke="#f59e0b" stroke-width="2"/>
<text x="410" y="502" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="14">"DENY"</text>

<line x1="170" y1="442" x2="170" y2="470" stroke="#4ade80" stroke-width="2.5"/>
<line x1="410" y1="442" x2="410" y2="470" stroke="#4ade80" stroke-width="2.5"/>

<rect x="90" y="550" width="440" height="56" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
<text x="310" y="584" text-anchor="middle" fill="#dcfce7" font-family="monospace" font-size="15" font-weight="700">("10.0.0.5", "ALLOW"), ("198.51.100.9", "DENY")</text>

<rect x="560" y="550" width="420" height="56" rx="10" fill="#0d1826" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
<text x="770" y="574" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">zip은 actions가 끝나서</text>
<text x="770" y="594" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">"172.16.0.9"는 조용히 버려짐</text>

<rect x="1080" y="380" width="360" height="226" rx="12" fill="#0d1f30" stroke="#334155" stroke-width="2"/>
<text x="1105" y="413" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="14" font-weight="700">strict=True를 쓰면</text>
<text x="1105" y="440" fill="#9cc8dc" font-family="monospace" font-size="13">zip(ips, actions, strict=True)</text>
<text x="1105" y="470" fill="#fca5a5" font-family="Arial, sans-serif" font-size="13">길이가 다르면 조용히 넘어가지 않고</text>
<text x="1105" y="492" fill="#fca5a5" font-family="Arial, sans-serif" font-size="13" font-weight="700">ValueError를 발생시켜</text>
<text x="1105" y="514" fill="#fca5a5" font-family="Arial, sans-serif" font-size="13" font-weight="700">정렬이 어긋난 데이터를 알려준다</text>
<text x="1105" y="548" fill="#7fb2cc" font-family="Arial, sans-serif" font-size="12">병렬 데이터(예: IP 목록과 판단 목록)의</text>
<text x="1105" y="568" fill="#7fb2cc" font-family="Arial, sans-serif" font-size="12">누락을 조기에 발견할 때 사용한다</text>
</svg>
