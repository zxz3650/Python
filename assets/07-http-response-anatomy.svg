<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="684" viewBox="0 0 1080 684" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">상태·헤더·본문과 Response 속성</title><desc id="desc">상태는 status_code, 형식은 headers, 본문 문자열은 text로 읽는다. JSON은 HTTP 메시지 전체가 아닌 본문 형식이다.</desc>
<g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="1080" height="684" rx="24" fill="#F3F6FA" stroke="none"/><text x="36" y="53" font-size="34" fill="#10283F" font-weight="700">HTTP 응답을 읽는 세 가지 창</text><text x="36" y="94" font-size="24" fill="#4F6478" font-weight="400">왼쪽은 받은 메시지, 오른쪽은 Python에서 읽는 위치입니다.</text><rect x="32" y="124" width="1016" height="146" rx="16" fill="#FFFFFF" stroke="#D9E2EB"/><rect x="32" y="124" width="7" height="146" rx="3" fill="#2463A0" stroke="none"/><text x="55" y="158" font-size="22" fill="#2463A0" font-weight="700">01  처리 결과</text><text x="55" y="202" font-size="25" fill="#24364B" font-weight="400">HTTP/1.0 200 OK</text><rect x="610" y="140" width="420" height="114" rx="12" fill="#E8F1FB" stroke="none"/><text x="630" y="176" font-size="27" fill="#2463A0" font-weight="600">response.status_code</text><text x="630" y="217" font-size="23" fill="#24364B" font-weight="400">HTTP 요청이 어떻게 처리됐나?</text><rect x="32" y="290" width="1016" height="146" rx="16" fill="#FFFFFF" stroke="#D9E2EB"/><rect x="32" y="290" width="7" height="146" rx="3" fill="#167166" stroke="none"/><text x="55" y="324" font-size="22" fill="#167166" font-weight="700">02  본문 설명</text><text x="55" y="368" font-size="25" fill="#24364B" font-weight="400">Content-Type: application/json</text><rect x="610" y="306" width="420" height="114" rx="12" fill="#E5F3EE" stroke="none"/><text x="630" y="342" font-size="27" fill="#167166" font-weight="600">response.headers</text><text x="630" y="383" font-size="23" fill="#24364B" font-weight="400">어떤 형식의 데이터라고 알리나?</text><rect x="32" y="456" width="1016" height="146" rx="16" fill="#FFFFFF" stroke="#D9E2EB"/><rect x="32" y="456" width="7" height="146" rx="3" fill="#8C5C14" stroke="none"/><text x="55" y="490" font-size="22" fill="#8C5C14" font-weight="700">03  실제 데이터</text><text x="55" y="534" font-size="25" fill="#24364B" font-weight="400">{&quot;status&quot;: &quot;ok&quot;,</text><text x="55" y="568" font-size="25" fill="#24364B" font-weight="400"> &quot;service&quot;: &quot;python-basic-lab&quot;}</text><rect x="610" y="472" width="420" height="114" rx="12" fill="#FFF2DA" stroke="none"/><text x="630" y="508" font-size="27" fill="#8C5C14" font-weight="600">response.text</text><text x="630" y="549" font-size="23" fill="#24364B" font-weight="400">본문을 문자열로 읽으면?</text><text x="40" y="647" font-size="24" fill="#344B61" font-weight="600">헤더와 본문 사이에는 빈 줄이 있습니다. JSON은 본문 안에 담깁니다.</text></g></svg>