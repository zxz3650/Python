<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="696" viewBox="0 0 1080 696" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">HTTP·API·JSON의 역할</title><desc id="desc">HTTP는 메시지 규칙, API는 입력과 출력의 약속, JSON은 본문의 데이터 표현이다.</desc>
<g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="1080" height="696" rx="24" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1080" height="168" rx="24" fill="#10283F" stroke="none"/><rect x="0" y="124" width="1080" height="44" rx="0" fill="#10283F" stroke="none"/><text x="40" y="48" font-size="20" fill="#9FCEE9" font-weight="600">CHAPTER 07  /  HTTP &amp; API</text><text x="40" y="103" font-size="36" fill="#FFFFFF" font-weight="700">응답을 받는 것에서, 의미를 읽는 것으로</text><text x="40" y="143" font-size="23" fill="#CADCE9" font-weight="400">HTTP · API · JSON의 역할을 구분하며 시작합니다.</text><rect x="32" y="196" width="1016" height="124" rx="16" fill="#FFFFFF" stroke="#D9E2EB"/><rect x="48" y="214" width="184" height="88" rx="12" fill="#E8F1FB" stroke="none"/><text x="64" y="247" font-size="19" fill="#2463A0" font-weight="600">01</text><text x="104" y="262" font-size="30" fill="#2463A0" font-weight="700">HTTP</text><text x="260" y="243" font-size="29" fill="#10283F" font-weight="600">어떤 규칙으로 주고받을까?</text><text x="260" y="285" font-size="24" fill="#24364B" font-weight="400">GET /health  →  200 OK</text><rect x="32" y="340" width="1016" height="124" rx="16" fill="#FFFFFF" stroke="#D9E2EB"/><rect x="48" y="358" width="184" height="88" rx="12" fill="#E5F3EE" stroke="none"/><text x="64" y="391" font-size="19" fill="#167166" font-weight="600">02</text><text x="104" y="406" font-size="30" fill="#167166" font-weight="700">API</text><text x="260" y="387" font-size="29" fill="#10283F" font-weight="600">어떤 결과를 받기로 약속했을까?</text><text x="260" y="429" font-size="24" fill="#24364B" font-weight="400">/health는 서비스 상태와 이름을 반환</text><rect x="32" y="484" width="1016" height="124" rx="16" fill="#FFFFFF" stroke="#D9E2EB"/><rect x="48" y="502" width="184" height="88" rx="12" fill="#FFF2DA" stroke="none"/><text x="64" y="535" font-size="19" fill="#8C5C14" font-weight="600">03</text><text x="104" y="550" font-size="30" fill="#8C5C14" font-weight="700">JSON</text><text x="260" y="531" font-size="29" fill="#10283F" font-weight="600">본문의 데이터를 어떻게 표현할까?</text><text x="260" y="573" font-size="24" fill="#24364B" font-weight="400">{&quot;status&quot;: &quot;ok&quot;, &quot;service&quot;: &quot;lab&quot;}</text><text x="40" y="659" font-size="24" fill="#344B61" font-weight="600">학습 흐름   요청 → 응답 관찰 → JSON 파싱 → 계약 검증 → 보고서</text></g></svg>