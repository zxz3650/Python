<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title3 desc3">
<title id="title3">단락 평가: 조건의 순서가 안전성을 결정한다</title>
<desc id="desc3">user가 None일 때 and 연산에서 안전 검사를 앞에 두면 뒤 조건이 평가되지 않아 오류가 없고, 순서를 바꾸면 None에 대한 메서드 호출로 AttributeError가 발생함을 보여주는 다이어그램</desc>
<defs>
  <filter id="shadowD1"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
  <marker id="arrowD1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fb2cc"/>
  </marker>
</defs>
<rect width="1500" height="560" rx="32" fill="#071a2b"/>
<text x="60" y="55" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">and의 단락 평가: 조건 순서가 안전성을 결정한다</text>
<text x="60" y="86" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">user = None — A가 falsey면 B는 평가되지 않는다</text>

<!-- ROW 1: safe order -->
<text x="60" y="135" fill="#4ade80" font-family="Arial, sans-serif" font-size="18" font-weight="700">✓ 안전한 순서</text>

<rect x="60" y="150" width="330" height="80" rx="12" fill="#102338" stroke="#38bdf8" stroke-width="2.5"/>
<text x="225" y="180" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="15">user is not None</text>
<text x="225" y="205" text-anchor="middle" fill="#f87171" font-family="Arial, sans-serif" font-size="14" font-weight="700">→ False</text>

<line x1="390" y1="190" x2="450" y2="190" stroke="#7fb2cc" stroke-width="2.5" marker-end="url(#arrowD1)"/>
<text x="420" y="175" text-anchor="middle" fill="#7fb2cc" font-family="monospace" font-size="14" font-weight="700">and</text>

<rect x="460" y="150" width="380" height="80" rx="12" fill="#0d1826" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
<text x="650" y="180" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="15" opacity="0.85">user.startswith("admin")</text>
<text x="650" y="205" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="14" font-weight="700" opacity="0.85">평가하지 않음 (스킵)</text>

<line x1="840" y1="190" x2="900" y2="190" stroke="#7fb2cc" stroke-width="2.5" marker-end="url(#arrowD1)"/>

<g filter="url(#shadowD1)">
<rect x="910" y="150" width="280" height="80" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
</g>
<text x="1050" y="182" text-anchor="middle" fill="#dcfce7" font-family="monospace" font-size="18" font-weight="700">is_admin = False</text>
<text x="1050" y="208" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="14">오류 없이 종료</text>

<!-- ROW 2: dangerous order -->
<text x="60" y="300" fill="#f87171" font-family="Arial, sans-serif" font-size="18" font-weight="700">✗ 위험한 순서 (주석 처리된 코드)</text>

<rect x="60" y="315" width="380" height="80" rx="12" fill="#102338" stroke="#38bdf8" stroke-width="2.5"/>
<text x="250" y="345" text-anchor="middle" fill="#e6f6ff" font-family="monospace" font-size="15">user.startswith("admin")</text>
<text x="250" y="370" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="14" font-weight="700">먼저 평가됨 (user=None)</text>

<line x1="440" y1="355" x2="500" y2="355" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowD1)"/>

<g filter="url(#shadowD1)">
<rect x="510" y="315" width="480" height="80" rx="12" fill="#3f1d1d" stroke="#ef4444" stroke-width="2.5"/>
</g>
<text x="750" y="347" text-anchor="middle" fill="#fecaca" font-family="monospace" font-size="15" font-weight="700">AttributeError</text>
<text x="750" y="373" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="13">'NoneType' object has no attribute 'startswith'</text>

<text x="1050" y="355" fill="#64748b" font-family="Arial, sans-serif" font-size="14" opacity="0.8">✕ and 뒤쪽(</text>
<text x="1050" y="378" fill="#64748b" font-family="Arial, sans-serif" font-size="14" opacity="0.8">is not None)에 도달 못 함</text>

<!-- footer -->
<rect x="60" y="440" width="1380" height="90" rx="12" fill="#0d1f30" stroke="#334155" stroke-width="2"/>
<text x="90" y="472" fill="#e6f6ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">원칙: 안전성 검사(비용이 낮고 실패해도 안전한 조건)를 먼저, 그 검사를 통과해야만 의미 있는 검사를 뒤에 둔다</text>
<text x="90" y="500" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="14">→ user is not None and user.startswith(...) : None이면 startswith는 절대 호출되지 않는다</text>
</svg>
